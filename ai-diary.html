<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆回廊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --green: #4ade80;
  --green-dim: rgba(74,222,128,0.15);
  --white-90: rgba(255,255,255,0.9);
  --white-60: rgba(255,255,255,0.6);
  --white-35: rgba(255,255,255,0.35);
  --white-15: rgba(255,255,255,0.15);
  --white-08: rgba(255,255,255,0.08);
  --white-04: rgba(255,255,255,0.04);
}

html, body {
  background: #000;
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Georgia, serif;
  overflow: hidden;
  height: 100vh; width: 100vw;
  color: rgba(255,255,255,0.85);
}
/* 恢复默认鼠标 */
* { cursor: auto; }

/* 猫爪光标元素隐藏（已停用） */
#pawCursor { display: none; }

/* ===== 全屏粒子背景 ===== */
#particleCanvas {
  position: fixed; top: 0; left: 0;
  z-index: 0;
  display: block;
}
/* Three.js renderer canvas（image 模式用，z-index 高于 WebGPU idle 层）*/
#threeContainer {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  pointer-events: none;
}
/* 上传图片展示层 */
#photoDisplay {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  max-width: 52vw; max-height: 58vh;
  object-fit: contain;
  border-radius: 2px;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.7s ease;
  display: none;
  /* 无 mask，边缘碎裂完全由粒子层表现 */
}

/* ===== 整体布局 ===== */
.app {
  position: relative; z-index: 10;
  height: 100vh;
  display: flex; flex-direction: column;
  background: transparent;
}

/* ===== 顶部导航 ===== */
nav {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center;
  padding: 22px 32px;
  z-index: 20;
}
.nav-brand {
  font-size: 12px; letter-spacing: 1px;
  color: rgba(255,255,255,0.75);
  font-weight: 400;
  min-width: 120px;
}
.nav-center {
  flex: 1; display: flex; justify-content: center; gap: 40px;
}
.nav-center a {
  font-size: 10px; letter-spacing: 2.5px;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase; text-decoration: none;
  cursor: pointer; transition: color 0.3s;
}
.nav-center a.active,
.nav-center a:hover { color: rgba(255,255,255,0.85); }
.nav-right {
  min-width: 120px; display: flex; justify-content: flex-end;
  align-items: center; gap: 18px;
}
.nav-icon {
  color: rgba(255,255,255,0.4); cursor: pointer;
  transition: color 0.3s; font-size: 14px;
  display: flex; align-items: center;
}
.nav-icon:hover { color: rgba(255,255,255,0.8); }
.nav-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }

/* ===== 页面容器 ===== */
.page { display: none; flex: 1; }
.page.active { display: flex; flex-direction: column; }

/* ===== 今晚页面 ===== */
#page-tonight {
  position: relative;
  height: 100vh;
  align-items: center; justify-content: center;
}

/* AI 状态 — 浮在粒子上方居中 */
.ai-status {
  position: absolute;
  top: 72px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  z-index: 15;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green), 0 0 20px rgba(74,222,128,0.4);
  animation: pulse-green 2.5s ease-in-out infinite;
}
.status-dot.thinking {
  background: #fbbf24;
  box-shadow: 0 0 10px #fbbf24, 0 0 20px rgba(251,191,36,0.4);
  animation: pulse-fast 0.6s ease-in-out infinite;
}
.status-dot.recording {
  background: #f87171;
  box-shadow: 0 0 10px #f87171, 0 0 20px rgba(248,113,113,0.4);
  animation: pulse-fast 0.5s ease-in-out infinite;
}
@keyframes pulse-green { 0%,100%{opacity:1;box-shadow:0 0 10px var(--green),0 0 20px rgba(74,222,128,0.4)} 50%{opacity:0.6;box-shadow:0 0 6px var(--green),0 0 10px rgba(74,222,128,0.2)} }
@keyframes pulse-fast { 0%,100%{opacity:1} 50%{opacity:0.3} }
.ai-name {
  font-size: 13px; letter-spacing: 1.5px;
  color: rgba(255,255,255,0.8);
  font-weight: 300;
}

/* 设置按钮 — 右上角浮层 */
.settings-btn {
  position: absolute; top: 68px; right: 32px;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 15; transition: all 0.3s;
}
.settings-btn:hover { background: rgba(255,255,255,0.12); }
.settings-btn svg { width: 15px; height: 15px; fill: none; stroke: rgba(255,255,255,0.5); stroke-width: 1.5; }

/* 对话气泡 — 浮在粒子上方 */
.chat-overlay {
  position: absolute;
  bottom: 160px; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  padding: 0 24px;
  z-index: 15;
  pointer-events: none;
}
.chat-bubble {
  font-size: 15px; line-height: 1.9;
  color: rgba(255,255,255,0.82);
  text-align: center;
  font-style: italic;
  font-weight: 300;
  letter-spacing: 0.3px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.6);
  min-height: 56px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px;
}
.chat-bubble .msg-user {
  font-style: normal;
  color: rgba(255,255,255,0.95);
  font-size: 14px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 8px 18px;
  pointer-events: auto;
  max-width: 100%;
}
.chat-bubble .msg-ai {
  font-style: italic;
  color: rgba(255,255,255,0.7);
  font-size: 15px;
}
.chat-bubble .typing {
  color: rgba(255,255,255,0.3);
  animation: blink-text 1s ease-in-out infinite;
}
@keyframes blink-text { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* ===== 底部控制区 ===== */
.bottom-controls {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0 32px 32px;
  z-index: 15;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}

/* 时间 + 保存记忆 + X 行 */
.control-row {
  display: flex; align-items: center; gap: 12px;
}
.timer-badge {
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px; padding: 6px 14px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgba(255,255,255,0.5);
  font-variant-numeric: tabular-nums;
}
.save-btn {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 20px; padding: 6px 18px;
  font-size: 11px; letter-spacing: 2px;
  color: rgba(255,255,255,0.75);
  cursor: pointer; text-transform: uppercase;
  font-family: inherit; transition: all 0.3s;
  display: flex; align-items: center; gap: 6px;
}
.save-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.95); }
.save-btn .arrow { font-size: 10px; opacity: 0.6; }
.clear-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.4); font-size: 14px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s; font-family: inherit;
}
.clear-btn:hover { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.3); color: rgba(248,113,113,0.8); }

/* 麦克风 + 小点 行 */
.mic-row {
  display: flex; align-items: center; gap: 28px;
}
.mic-btn {
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.3s;
  box-shadow: 0 4px 30px rgba(0,0,0,0.4);
}
.mic-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.35); }
.mic-btn.recording {
  background: rgba(248,113,113,0.15);
  border-color: rgba(248,113,113,0.5);
  box-shadow: 0 0 30px rgba(248,113,113,0.2);
  animation: pulse-ring 1s ease-in-out infinite;
}
@keyframes pulse-ring {
  0%,100%{ box-shadow: 0 0 0 0 rgba(248,113,113,0.3), 0 4px 30px rgba(0,0,0,0.4); }
  50%{ box-shadow: 0 0 0 12px rgba(248,113,113,0), 0 4px 30px rgba(0,0,0,0.4); }
}
.mic-btn svg { width: 24px; height: 24px; fill: rgba(255,255,255,0.8); }
.mic-btn.recording svg { fill: #f87171; }
.dot-btn {
  width: 14px; height: 14px; border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 1.5px solid rgba(255,255,255,0.4);
  cursor: pointer; transition: all 0.3s;
}
.dot-btn:hover { background: rgba(255,255,255,0.5); }

/* 上传图片提示 */
.upload-hint {
  font-size: 11px; letter-spacing: 1.5px;
  color: rgba(255,255,255,0.3);
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; transition: color 0.3s;
  text-transform: uppercase;
}
.upload-hint:hover { color: rgba(255,255,255,0.6); }
.upload-hint svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; }
.upload-save-row {
  display: flex; align-items: center; gap: 20px;
}

/* 文字输入行（隐藏，点击小点展开） */
.text-input-row {
  display: none;
  width: 100%; max-width: 400px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 30px; padding: 10px 20px;
  align-items: center; gap: 10px;
  backdrop-filter: blur(10px);
}
.text-input-row.open { display: flex; }
.text-input-row input {
  flex: 1; background: none; border: none; outline: none;
  color: rgba(255,255,255,0.9); font-size: 13px;
  font-family: inherit;
}
.text-input-row input::placeholder { color: rgba(255,255,255,0.2); }
.text-send-btn {
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.4); font-size: 16px;
  transition: color 0.2s; padding: 0 4px;
}
.text-send-btn:hover { color: rgba(255,255,255,0.8); }

/* ===== 记忆页面 ===== */
#page-memory {
  padding: 80px 48px 32px;
  overflow-y: auto; flex-direction: column; gap: 24px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
  background: rgba(0,0,0,0.7);
}
.memory-header { flex-shrink: 0; margin-bottom: 8px; }
.memory-header h2 {
  font-size: 10px; letter-spacing: 4px;
  color: rgba(255,255,255,0.3); text-transform: uppercase; font-weight: normal;
}
.memory-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px; padding-bottom: 20px;
}
.memory-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px; overflow: hidden; cursor: pointer;
  transition: all 0.3s;
}
.memory-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
.memory-card-cover { width: 100%; height: 140px; background: #050505; position: relative; overflow: hidden; }
.memory-card-cover canvas { width: 100%; height: 100%; display: block; }
.memory-card-body { padding: 14px 16px; }
.memory-card-date { font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.2); text-transform: uppercase; margin-bottom: 8px; }
.memory-card-title { font-size: 13px; color: rgba(255,255,255,0.85); margin-bottom: 6px; line-height: 1.5; }
.memory-card-preview { font-size: 12px; color: rgba(255,255,255,0.3); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.memory-empty { text-align: center; padding: 80px 20px; color: rgba(255,255,255,0.2); font-size: 13px; letter-spacing: 1px; }

/* ===== 日记弹窗 ===== */
.diary-modal {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.88); backdrop-filter: blur(16px);
  align-items: center; justify-content: center; padding: 40px;
}
.diary-modal.open { display: flex; }
.diary-content {
  background: rgba(10,10,10,0.95);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; padding: 36px 40px; max-width: 560px; width: 100%;
  max-height: 80vh; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
}
.diary-date { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.2); text-transform: uppercase; margin-bottom: 20px; }
.diary-title { font-size: 18px; color: rgba(255,255,255,0.9); margin-bottom: 16px; line-height: 1.5; font-weight: normal; }
.diary-body { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 2; white-space: pre-wrap; }
.diary-close {
  position: absolute; top: 20px; right: 20px;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.5); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.diary-close:hover { background: rgba(255,255,255,0.12); }

/* ===== 保存动画 ===== */
.saving-overlay {
  display: none; position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
  align-items: center; justify-content: center; flex-direction: column; gap: 20px;
}
.saving-overlay.open { display: flex; }
.saving-text {
  font-size: 11px; letter-spacing: 4px;
  color: rgba(255,255,255,0.4); text-transform: uppercase;
  animation: pulse-fast 1.5s ease-in-out infinite;
}

/* ===== API 设置弹窗 ===== */
.api-modal {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.88); backdrop-filter: blur(16px);
  align-items: center; justify-content: center; padding: 40px;
}
.api-modal.open { display: flex; }
.api-box {
  background: rgba(8,8,8,0.98);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; padding: 32px; max-width: 440px; width: 100%;
}
.api-box h3 { font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-bottom: 20px; font-weight: normal; }
.api-box input {
  width: 100%; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 12px 14px; color: rgba(255,255,255,0.9);
  font-size: 13px; font-family: monospace; outline: none; margin-bottom: 12px;
  transition: border-color 0.3s;
}
.api-box input:focus { border-color: rgba(255,255,255,0.25); }
.api-box .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
.api-box button {
  padding: 8px 20px; border-radius: 8px; font-size: 11px; cursor: pointer;
  letter-spacing: 1.5px; font-family: inherit; transition: all 0.2s; text-transform: uppercase;
}
.btn-cancel { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); }
.btn-save-key { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); }
.btn-save-key:hover { background: rgba(255,255,255,0.14); }

/* ===== 粒子效果设置面板 ===== */
.fx-panel {
  position: fixed; top: 0; right: -280px; bottom: 0; width: 280px;
  background: rgba(0,0,0,0.92); backdrop-filter: blur(20px);
  border-left: 1px solid rgba(255,255,255,0.06);
  z-index: 90; transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
  padding: 80px 20px 40px; overflow-y: auto;
}
.fx-panel.open { right: 0; }
.fx-panel-title {
  font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.35);
  text-transform: uppercase; margin-bottom: 24px;
}
.fx-group {
  margin-bottom: 20px;
}
.fx-group label {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: rgba(255,255,255,0.6); letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.fx-group label span.fx-val {
  font-size: 11px; color: rgba(255,255,255,0.35); font-family: monospace;
}
.fx-group input[type="range"] {
  -webkit-appearance: none; width: 100%; height: 3px;
  background: rgba(255,255,255,0.1); border-radius: 2px; outline: none;
}
.fx-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  background: rgba(255,255,255,0.7); border-radius: 50%; cursor: pointer;
}
.fx-group select {
  width: 100%; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
  padding: 8px 10px; color: rgba(255,255,255,0.7); font-size: 12px;
  outline: none; cursor: pointer;
}
.fx-group select option { background: #111; color: #ccc; }
.fx-close {
  position: absolute; top: 24px; right: 20px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.06); border: none;
  color: rgba(255,255,255,0.4); font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.fx-close:hover { background: rgba(255,255,255,0.12); }

/* ===== 图片上传隐藏 input ===== */
#imgFileInput { display: none; }

/* ===== 开启礼物页面 ===== */
#page-gift {
  position: relative;
  height: 100vh;
  align-items: stretch;
  justify-content: stretch;
  overflow: hidden;
}
#gift-scene {
  position: relative;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
#gift-three {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}
#giftVideo {
  position: absolute;
  bottom: 24px; right: 24px;
  width: 160px; height: 120px;
  border-radius: 10px;
  object-fit: cover;
  opacity: 0.55;
  transform: scaleX(-1);
  z-index: 5;
  border: 1px solid rgba(255,255,255,0.08);
}
#giftOverlay {
  position: absolute;
  bottom: 24px; right: 24px;
  width: 160px; height: 120px;
  border-radius: 10px;
  z-index: 6;
  pointer-events: none;
  transform: scaleX(-1);
}
#giftCamDot {
  position: absolute;
  bottom: 30px; right: 30px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 6px #4ade80;
  z-index: 7;
  transition: background 0.3s, box-shadow 0.3s;
}
#giftGuide {
  position: absolute;
  bottom: 160px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px; letter-spacing: 2px;
  color: rgba(255,255,255,0.3);
  z-index: 8;
  text-align: center;
  transition: opacity 0.6s;
  white-space: nowrap;
}
#giftFistRing {
  position: absolute;
  bottom: 16px; right: 16px;
  width: 60px; height: 60px;
  z-index: 8;
  opacity: 0;
  transition: opacity 0.3s;
}

/* ===== 礼物交互场景 (gb- 命名空间) ===== */
#gb-canvas-wrapper {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at center, #0a0a0a 0%, #000 90%);
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#gb-canvas-container { width: 100%; height: 100%; display: block; }

#gb-controls {
  position: absolute; top: 20px; right: 20px; z-index: 9999;
  display: flex; gap: 15px; transition: opacity 0.5s;
}
.gb-icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--white-15);
  color: var(--green); font-size: 20px;
  display: flex; justify-content: center; align-items: center;
  cursor: pointer; backdrop-filter: blur(4px); transition: 0.3s;
}
.gb-icon-btn:hover { background: var(--green-dim); box-shadow: 0 0 12px rgba(74,222,128,0.3); }

#gb-video-container {

// ============================================================
// 语音聊天模式 — 点击开启，显示计时+关闭按钮
// UI状态与语音识别解耦，识别断开会自动重连，只有手动关闭才退出
// ============================================================
let voiceTimerInterval = null;
let voiceChatActive = false; // UI层面是否处于语音聊天模式

function toggleVoice() {
  if (voiceChatActive) { stopVoice(); return; }
  startVoiceChat();
}

function startVoiceChat() {
  voiceChatActive = true;
  isRecording = true;
  document.getElementById('micBtn').classList.add('recording');
  document.getElementById('statusDot').className = 'status-dot recording';
  setStatus('recording', '正在听…');
  // 显示语音控制行（计时+关闭），隐藏麦克风行
  document.getElementById('voiceControlRow').style.display = 'flex';
  document.getElementById('micRow').style.display = 'none';
  // 开始计时
  timerSeconds = 0;
  updateTimerDisplay();
  voiceTimerInterval = setInterval(() => {
    timerSeconds++;
    updateTimerDisplay();
  }, 1000);
  // 启动语音识别
  startRecognition();
}

let voicePermissionGranted = false; // 权限是否已获得过

function startRecognition() {
  if (!voiceChatActive) return;
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = () => {
    voicePermissionGranted = true; // 成功启动说明权限已授予
  };
  recognition.onresult = e => {
    const last = e.results[e.results.length - 1];
    if (last.isFinal) {
      const text = last[0].transcript;
      document.getElementById('userInput').value = text;
      sendMessage();
    }
  };
  recognition.onerror = (e) => {
    // 权限被拒绝或未授权 → 不再重试（避免反复弹权限提示）
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      voicePermissionGranted = false;
      return; // onend 中会检查此标志
    }
    // 其他错误忽略，等 onend 重连
  };
  recognition.onend = () => {
    // 权限未授予或被拒绝时不重试
    if (!voicePermissionGranted) return;
    // 识别结束时自动重连（只要聊天模式还在）
    if (voiceChatActive) {
      setTimeout(() => startRecognition(), 800);
    }
  };
  try { recognition.start(); } catch(e) {}
}

function stopVoice() {
  voiceChatActive = false;
  isRecording = false;
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('statusDot').className = 'status-dot';
  setStatus('listening', localStorage.getItem('ai_model_name') || 'Gemini');
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  // 隐藏语音控制行，恢复麦克风行
  document.getElementById('voiceControlRow').style.display = 'none';
  document.getElementById('micRow').style.display = 'flex';
  // 停止计时
  if (voiceTimerInterval) { clearInterval(voiceTimerInterval); voiceTimerInterval = null; }
}

function updateTimerDisplay() {
  const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
  const s = String(timerSeconds % 60).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = m + ':' + s;
}

// ============================================================
// 发送消息
// ============================================================
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  // 关闭文字输入框
  textInputOpen = false;
  document.getElementById('textInputRow').classList.remove('open');

  appendBubble('user', text);
  messages.push({ role: 'user', text });

  setStatus('thinking', '思考中…');
  document.getElementById('statusDot').className = 'status-dot thinking';
  appendTyping();

  let reply;
  if (GEMINI_API_KEY) {
    reply = await callGemini(text);
  } else {
    await sleep(1200 + Math.random() * 800);
    reply = MOCK_REPLIES[Math.floor(Math.random() * MOCK_REPLIES.length)];
  }

  removeTyping();
  appendBubble('ai', reply);
  messages.push({ role: 'ai', text: reply });
  document.getElementById('statusDot').className = 'status-dot';
  setStatus('listening', 'Gemini');
}

// ============================================================
// Gemini API
// ============================================================
function getModelId() {
  // 用户设置的模型名如果看起来像合法model id就用，否则用默认
  const saved = (localStorage.getItem('ai_model_name') || '').trim();
  // 合法的model id格式示例: gemini-2.0-flash, gemini-1.5-pro 等
  if (saved && /^[a-zA-Z0-9._-]+$/.test(saved)) return saved;
  return 'gemini-2.0-flash';
}

async function callGemini(userText) {
  try {
    const modelId = getModelId();
    const history = messages.slice(-8).map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    }));
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${GEMINI_API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: AI_PERSONA }] },
          contents: [...history, { role: 'user', parts: [{ text: userText }] }],
          generationConfig: { temperature: 0.85, maxOutputTokens: 200 }
        })
      }
    );
    const data = await res.json();
    if (data.error) return `API错误：${data.error.message || '未知错误'}`;
    return data.candidates?.[0]?.content?.parts?.[0]?.text || '……（AI 暂时没有回应）';
  } catch (e) {
    return '网络好像有点问题，但我还在这里陪着你。';
  }
}

// ============================================================
// 生成日记
// ============================================================
async function generateDiary() {
  const conversation = messages.map(m => `${m.role === 'user' ? '我' : 'AI'}：${m.text}`).join('\n');
  if (GEMINI_API_KEY) {
    try {
      const prompt = `以下是用户今天睡前的倾诉对话：\n\n${conversation}\n\n请根据这段对话，以第一人称为用户写一篇今天的日记。要求：\n1. 语气温柔、真实，像用户自己写的\n2. 提炼出今天最核心的情绪和事件\n3. 结尾用一句有力量的话收尾\n4. 200字左右\n5. 先给出一个日记标题（一行），再写正文`;
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${getModelId()}:generateContent?key=${GEMINI_API_KEY}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.9, maxOutputTokens: 400 }
          })
        }
      );
      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const lines = text.trim().split('\n').filter(l => l.trim());
      return { title: lines[0] || '今天', body: lines.slice(1).join('\n') };
    } catch (e) { return mockDiary(); }
  } else {
    await sleep(1500);
    return mockDiary();
  }
}

function mockDiary() {
  const userTexts = messages.filter(m => m.role === 'user').map(m => m.text);
  const preview = userTexts[0] || '今天的一些事';
  return {
    title: `关于今天——${preview.slice(0, 12)}${preview.length > 12 ? '…' : ''}`,
    body: `今天说了很多，也听到了很多。\n\n${userTexts.join('。\n\n')}\n\n不管今天发生了什么，能把它说出来，就已经是一种释放了。\n\n明天又是新的一天。`
  };
}

async function saveMemory() {
  if (messages.length === 0) {
    alert('先跟 AI 说说今天发生的事吧～');
    return;
  }
  document.getElementById('savingOverlay').classList.add('open');
  animateSavingParticle();

  const diary = await generateDiary();
  const now = new Date();
  const memory = {
    id: Date.now(),
    date: now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }),
    dateShort: `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`,
    title: diary.title,
    body: diary.body,
    preview: diary.body.slice(0, 60),
    hue: Math.floor(Math.random() * 60) + 190
  };

  memories.unshift(memory);
  localStorage.setItem('ai_diary_memories', JSON.stringify(memories));

  await sleep(2000);
  document.getElementById('savingOverlay').classList.remove('open');

  messages = [];
  timerSeconds = 0;
  const bubble = document.getElementById('chatBubble');
  bubble.innerHTML = '<span class="msg-ai">今天的记忆已经保存好了。明天见，好好睡～</span>';

  setTimeout(() => {
    switchPage('memory', document.querySelectorAll('.nav-center a')[1]);
  }, 800);
}

function renderMemories() {
  const grid = document.getElementById('memoryGrid');
  if (memories.length === 0) {
    grid.innerHTML = '<div class="memory-empty">还没有记忆<br><br>今晚说说今天发生的事，保存你的第一篇日记</div>';

  }
  grid.innerHTML = memories.map(m => `
    <div class="memory-card" onclick="openDiary(${m.id})">
      <div class="memory-card-cover">
        <canvas class="mini-particle" data-hue="${m.hue}" width="280" height="140"></canvas>
      </div>
      <div class="memory-card-body">
        <div class="memory-card-date">${m.dateShort}</div>
        <div class="memory-card-title">${m.title}</div>
        <div class="memory-card-preview">${m.preview}…</div>
      </div>
    </div>
  `).join('');
  document.querySelectorAll('.mini-particle').forEach(c => {
    drawMiniParticle(c, parseInt(c.dataset.hue));
  });
}

function drawMiniParticle(canvas, hue) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
  const pts = Array.from({ length: 400 }, () => {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() < 0.5 ? 35 + Math.random() * 20 : Math.random() * 32;
    return { x: W / 2 + Math.cos(a) * r, y: H / 2 + Math.sin(a) * r, size: Math.random() * 1.4 + 0.3, alpha: Math.random() * 0.6 + 0.3 };
  });
  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue},70%,70%,${p.alpha})`; ctx.fill();
  });
}

function openDiary(id) {
  const m = memories.find(x => x.id === id);
  if (!m) return;
  document.getElementById('diaryDate').textContent = m.date;
  document.getElementById('diaryTitle').textContent = m.title;
  document.getElementById('diaryBody').textContent = m.body;
  document.getElementById('diaryModal').classList.add('open');
}
function closeDiary() { document.getElementById('diaryModal').classList.remove('open'); }

// ============================================================
// 保存动画粒子
// ============================================================
function animateSavingParticle() {
  const c = document.getElementById('savingParticle');
  const ctx = c.getContext('2d');
  const W = 200, H = 200, cx = W / 2, cy = H / 2;
  const pts = Array.from({ length: 800 }, () => {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() < 0.55 ? 60 + (Math.random() - .5) * 28 : Math.random() * 55;
    return { ox: cx + Math.cos(a) * r, oy: cy + Math.sin(a) * r, x: cx + (Math.random() - .5) * W, y: cy + (Math.random() - .5) * H, size: Math.random() * 1.5 + 0.3, hue: 200 + Math.random() * 40, alpha: Math.random() * 0.6 + 0.3, phase: Math.random() * Math.PI * 2, speed: Math.random() * 0.008 + 0.003 };
  });
  let running = true;
  document.getElementById('savingOverlay').addEventListener('transitionend', () => { running = false; }, { once: true });
  function draw(ts) {
    if (!running) return;
    const t = ts / 1000;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
    pts.forEach(p => {
      p.x += (p.ox - p.x) * 0.016; p.y += (p.oy - p.y) * 0.016;
      const j = Math.sin(t * p.speed * 1000 + p.phase) * 1.2;
      const a = p.alpha * (0.65 + 0.35 * Math.sin(t * p.speed * 800 + p.phase));
      ctx.beginPath(); ctx.arc(p.x + j, p.y + j, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},75%,72%,${a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function updateFxSetting(key, el) {
  const v = el.value;
  switch(key) {
    case 'duration':
      fxSettings.duration = Number(v);
      document.getElementById('fxDurationVal').textContent = v >= 60 ? (v / 60) + '分钟' : v + '秒';
      break;
    case 'direction':
      fxSettings.direction = v;
      const dirMap = { random:'随机', left:'从左往右', right:'从右往左', top:'从上往下', bottom:'从下往上' };
      document.getElementById('fxDirVal').textContent = dirMap[v];
      break;
    case 'color':
      fxSettings.color = v;
      const colorMap = { random:'随机', orange:'橙色', green:'绿色', blue:'蓝色', original:'原图色' };
      document.getElementById('fxColorVal').textContent = colorMap[v];
      break;
    case 'size':
      fxSettings.size = Number(v);
      document.getElementById('fxSizeVal').textContent = v;
      break;
    case 'density':
      fxSettings.density = Number(v);
      document.getElementById('fxDensityVal').textContent = v;
      break;
    case 'speed':
      fxSettings.speed = Number(v);
      document.getElementById('fxSpeedVal').textContent = v;
      break;
    case 'delay':
      fxSettings.delay = Number(v);
      document.getElementById('fxDelayVal').textContent = v + '秒';
      break;
  }
  localStorage.setItem('fx_settings', JSON.stringify(fxSettings));
}

// ============================================================
// 全屏粒子系统 — Three.js WebGL 3D 版
// ============================================================

const PARTICLE_COUNT = 80000;
let imageStartTime = 0;
// 挂到 window 上，供 WebGPU module 读取
window.particleMode = 'idle';
// 本地别名，保持后续代码不变
Object.defineProperty(window, '_pmProxy', { get() { return window.particleMode; } });
let particleMode = 'idle'; // 仍保留局部变量，赋值时同步到 window

// Three.js 全局对象
let threeScene, threeCamera, threeRenderer;
let threeGeo, threeMat, threeMesh;
// 粒子数据数组（Float32Array，直接写入 BufferGeometry）
let posArr, colArr, sizeArr;
// 每粒子元数据（目标位置、颜色等）
let ptData = [];
let pTime = 0;

function initParticles() {
  const W = window.innerWidth, H = window.innerHeight;

  // ── Three.js 场景 ──
  threeScene = new THREE.Scene();

  // 正交相机：标准 Three.js 坐标系
  // 视锥：left=-W/2, right=W/2, top=H/2, bottom=-H/2（Y轴上正下负，原点在屏幕中心）
  threeCamera = new THREE.OrthographicCamera(-W/2, W/2, H/2, -H/2, -2000, 2000);
  threeCamera.position.set(0, 0, 1000);

  threeRenderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
  threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  threeRenderer.setSize(W, H);
  threeRenderer.setClearColor(0x000000, 0);
  threeRenderer.domElement.style.position = 'fixed';
  threeRenderer.domElement.style.top = '0';
  threeRenderer.domElement.style.left = '0';
  threeRenderer.domElement.style.pointerEvents = 'none';
  document.getElementById('threeContainer').appendChild(threeRenderer.domElement);

  // ── BufferGeometry（image 模式用）──
  threeGeo = new THREE.BufferGeometry();
  posArr  = new Float32Array(PARTICLE_COUNT * 3);
  colArr  = new Float32Array(PARTICLE_COUNT * 3);
  sizeArr = new Float32Array(PARTICLE_COUNT);

  // ── 初始化 ptData（image 模式粒子，初始散布在屏幕上）──
  ptData = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const x = (Math.random() - 0.5) * W;
    const y = (Math.random() - 0.5) * H;
    const z = (Math.random() - 0.5) * 200;
    const rv = 0.3 + Math.random() * 0.4;
    const gv = 0.4 + Math.random() * 0.4;
    const bv = 0.7 + Math.random() * 0.3;
    const sz = 1.5 + Math.random() * 2.0;
    posArr[i*3]   = x; posArr[i*3+1] = y; posArr[i*3+2] = z;
    colArr[i*3]   = rv; colArr[i*3+1] = gv; colArr[i*3+2] = bv;
    sizeArr[i] = sz;
    ptData.push({
      x, y, z,

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  _currentImageMime = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    _currentImageBase64 = dataUrl.split(',')[1];
    const img = new Image();
    img.onload = () => {
      window._lastImageDataUrl = dataUrl;
      window._imageMode     = true;
      window._lastImageData = img;
      window._lastImg       = img;

      const W = window.innerWidth, H = window.innerHeight;
      const maxW = W * 0.52, maxH = H * 0.58;
      const imgRatio = img.width / img.height;
      let dispW, dispH;
      if (img.width / maxW > img.height / maxH) {
        dispW = maxW; dispH = maxW / imgRatio;
      } else {
        dispH = maxH; dispW = maxH * imgRatio;
      }

      // 显示原图（无像素化）
      const photoEl = document.getElementById('photoDisplay');
      if (photoEl) {
        photoEl.src = dataUrl;
        photoEl.style.display = 'block';
        photoEl.style.imageRendering = 'auto';
        setTimeout(() => { photoEl.style.opacity = '1'; }, 50);
      }

      imageStartTime = pTime;
      particleMode = window.particleMode = 'image';

      messages = [];

      // 根据设置的停留时间后启动消散效果
      setTimeout(() => startDisintegrate(img, dispW, dispH), fxSettings.delay * 1000);
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

// ============================================================
// 图片边缘消散效果 — 随机选一个方向，从该边开始缓慢消散
// ============================================================
function startDisintegrate(img, dispW, dispH) {
  // 清除旧消散
  if (window._disintCanvas) {
    window._disintCanvas.remove();
    window._disintCanvas = null;
  }
  if (window._disintAnim) {
    cancelAnimationFrame(window._disintAnim);
    window._disintAnim = null;
  }

  // 创建消散 canvas，覆盖在 photoDisplay 上
  const cvs = document.createElement('canvas');
  const dpr = window.devicePixelRatio || 1;
  const cW = Math.round(dispW);
  const cH = Math.round(dispH);
  cvs.width = cW * dpr;
  cvs.height = cH * dpr;
  cvs.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:${cW}px;height:${cH}px;z-index:3;pointer-events:none;`;
  document.body.appendChild(cvs);
  window._disintCanvas = cvs;

  const ctx = cvs.getContext('2d');
  ctx.scale(dpr, dpr);

  // 采样原图像素
  const sampleW = Math.min(300, cW);
  const sampleH = Math.round(sampleW * (cH / cW));
  const sCanvas = document.createElement('canvas');
  sCanvas.width = sampleW; sCanvas.height = sampleH;
  const sCtx = sCanvas.getContext('2d');
  sCtx.drawImage(img, 0, 0, sampleW, sampleH);
  const imgData = sCtx.getImageData(0, 0, sampleW, sampleH).data;

  // 方向：根据设置选择
  let dir;
  if (fxSettings.direction === 'random') dir = Math.floor(Math.random() * 4);
  else if (fxSettings.direction === 'left') dir = 0;
  else if (fxSettings.direction === 'right') dir = 1;
  else if (fxSettings.direction === 'top') dir = 2;
  else dir = 3;

  // 颜色：根据设置选择
  const colorOptions = ['rgb(255,160,0)', 'rgb(40,200,60)', 'rgb(30,80,255)'];
  let chosenColor;
  if (fxSettings.color === 'random') chosenColor = colorOptions[Math.floor(Math.random() * 3)];
  else if (fxSettings.color === 'orange') chosenColor = colorOptions[0];
  else if (fxSettings.color === 'green') chosenColor = colorOptions[1];
  else if (fxSettings.color === 'blue') chosenColor = colorOptions[2];
  else chosenColor = null; // original - 用原图色

  const particles = [];
  const STEP = fxSettings.density;
  for (let y = 0; y < sampleH; y += STEP) {
    for (let x = 0; x < sampleW; x += STEP) {
      const pi = (y * sampleW + x) * 4;
      if (imgData[pi + 3] < 30) continue;

      const nx = x / sampleW;
      const ny = y / sampleH;

      // 根据方向计算消散阈值：越靠近选定边缘的像素越先消散
      let edgeDist;
      if (dir === 0) edgeDist = nx;           // 从左边开始，左边的先飞
      else if (dir === 1) edgeDist = 1 - nx;  // 从右边开始
      else if (dir === 2) edgeDist = ny;      // 从上边开始
      else edgeDist = 1 - ny;                 // 从下边开始

      const jitter = (Math.random() - 0.5) * 0.1;
      const finalThreshold = Math.max(0, Math.min(1, edgeDist + jitter));

      // 飞散方向：朝选定方向飞出
      let vx = 0, vy = 0;
      if (dir === 0) vx = -(0.3 + Math.random() * 0.5);
      else if (dir === 1) vx = (0.3 + Math.random() * 0.5);
      else if (dir === 2) vy = -(0.3 + Math.random() * 0.5);
      else vy = (0.3 + Math.random() * 0.5);
      // 少量垂直方向扰动
      vx += (Math.random() - 0.5) * 0.2;
      vy += (Math.random() - 0.5) * 0.2;

      // 粒子颜色
      const pColor = chosenColor || `rgb(${imgData[pi]},${imgData[pi+1]},${imgData[pi+2]})`;

      particles.push({
        ox: nx * cW,
        oy: ny * cH,
        x: nx * cW,
        y: ny * cH,
        vx: vx,
        vy: vy,
        color: pColor,
        threshold: finalThreshold,
        alpha: 1,
        size: fxSettings.size + Math.random() * (fxSettings.size * 0.5),
        freed: false,
      });
    }
  }

  // 隐藏原图，用canvas接管绘制
  const photoEl = document.getElementById('photoDisplay');
  const totalDuration = fxSettings.duration * 1000;
  const flySpeed = fxSettings.speed;
  const eraseSize = Math.ceil(STEP * (cW / sampleW)) + 2;
  const startT = Date.now();

  function animateDisintegrate() {
    const elapsed = Date.now() - startT;
    const progress = Math.min(1, elapsed / totalDuration);

    ctx.clearRect(0, 0, cW, cH);

    // 首帧隐藏原图
    if (elapsed < 100 && photoEl) {
      photoEl.style.opacity = '0';
    }

    // 绘制原图，然后擦除已消散部分
    ctx.drawImage(img, 0, 0, cW, cH);

    // 用 destination-out 模式擦除已消散的像素（变为透明）
    ctx.globalCompositeOperation = 'destination-out';
    for (const p of particles) {
      if (!p.freed && progress >= p.threshold) {
        p.freed = true;
      }
      if (p.freed) {
        ctx.fillStyle = 'rgba(0,0,0,1)';
        ctx.fillRect(p.ox - 1, p.oy - 1, eraseSize, eraseSize);
      }
    }
    ctx.globalCompositeOperation = 'source-over';

    // 绘制飞散中的粒子（短暂飘出后消失）
    for (const p of particles) {
      if (p.freed) {
        p.x += p.vx * flySpeed;
        p.y += p.vy * flySpeed;
        p.alpha -= 0.02;
        if (p.alpha <= 0) continue;

        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;

    if (elapsed < totalDuration + 3000) {
      window._disintAnim = requestAnimationFrame(animateDisintegrate);
    }
  }

  window._disintAnim = requestAnimationFrame(animateDisintegrate);
}

function getTextParticles(text, width=600, height=300, fontSize=180) {
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,width,height);
  ctx.fillStyle = '#fff';
  ctx.font = `900 ${fontSize}px "Microsoft YaHei", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, width/2, height/2);
  const imgData = ctx.getImageData(0,0,width,height).data;
  const particles = [];

  for (let y=0; y<height; y+=step) {
    for (let x=0; x<width; x+=step) {
      if (imgData[(y*width+x)*4] > 128)
        particles.push(new THREE.Vector3((x-width/2)*0.8, -(y-height/2)*0.8, 0));

}

function morphToText(text, fontSize=180) {
  const targetPos = getTextParticles(text, 600, 300, fontSize);
  const positions = introPoints.geometry.attributes.position.array;
  for (let i=0; i<MAX_INTRO_PARTICLES; i++) {
    const start = new THREE.Vector3(positions[i*3], positions[i*3+1], positions[i*3+2]);
    const end = i < targetPos.length
      ? targetPos[i]
      : new THREE.Vector3((Math.random()-0.5)*800, (Math.random()-0.5)*800, -500-Math.random()*500);
    new TWEEN.Tween(start).to(end, 800).easing(TWEEN.Easing.Cubic.InOut)
      .onUpdate(() => {
        positions[i*3]=start.x; positions[i*3+1]=start.y; positions[i*3+2]=start.z;
        introPoints.geometry.attributes.position.needsUpdate = true;
      }).start();
  }
}

function triggerWarpSpeed(callback) {
  const positions = introPoints.geometry.attributes.position.array;
  for (let i=0; i<MAX_INTRO_PARTICLES; i++) {
    const start = new THREE.Vector3(positions[i*3], positions[i*3+1], positions[i*3+2]);
    const end = start.clone().add(new THREE.Vector3((Math.random()-0.5)*500, (Math.random()-0.5)*500, 1500));
    new TWEEN.Tween(start).to(end, 1200).easing(TWEEN.Easing.Exponential.In)
      .onUpdate(() => {
        positions[i*3]=start.x; positions[i*3+1]=start.y; positions[i*3+2]=start.z;
        introPoints.geometry.attributes.position.needsUpdate = true;
      }).start();
  }
  setTimeout(() => { introPoints.visible = false; if(callback) callback(); }, 1200);
}

// ── 烟花 ──
function createFirework() {
  const fw = {
    pos: new THREE.Vector3((Math.random()-0.5)*200, -150, (Math.random()-0.5)*100-50),
    targetY: 40+Math.random()*120,
    color: new THREE.Color().setHSL(0.5+Math.random()*0.2, 1, 0.7),
    particles: null, exploded: false, life: 1.0
  };
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([fw.pos.x, fw.pos.y, fw.pos.z], 3));
  fw.rocket = new THREE.Points(geo, new THREE.PointsMaterial({color: fw.color, size: 7, transparent: true, blending: THREE.AdditiveBlending}));
  scene.add(fw.rocket);
  fireworks.push(fw);
}

function updateFireworks() {
  for (let i=fireworks.length-1; i>=0; i--) {
    const fw = fireworks[i];
    if (!fw.exploded) {
      fw.pos.y += 3;
      fw.rocket.geometry.attributes.position.setY(0, fw.pos.y);
      fw.rocket.geometry.attributes.position.needsUpdate = true;
      if (fw.pos.y >= fw.targetY) { fw.exploded = true; scene.remove(fw.rocket); explodeFirework(fw); }
    } else {
      fw.life -= 0.015;
      const positions = fw.particles.geometry.attributes.position.array;
      for (let j=0; j<fw.velocities.length; j++) {
        positions[j*3]   += fw.velocities[j].x;
        positions[j*3+1] += fw.velocities[j].y;
        positions[j*3+2] += fw.velocities[j].z;
        fw.velocities[j].y -= 0.03;
      }
      fw.particles.geometry.attributes.position.needsUpdate = true;
      fw.particles.material.opacity = fw.life;
      if (fw.life <= 0) { scene.remove(fw.particles); fireworks.splice(i,1); }
    }
  }
}

function explodeFirework(fw) {
  const count = 500;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  fw.velocities = [];
  for (let i=0; i<count; i++) {
    pos[i*3]=fw.pos.x; pos[i*3+1]=fw.pos.y; pos[i*3+2]=fw.pos.z;
    fw.velocities.push(randomSpherePoint(1.0+Math.random()*5.0));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  fw.particles = new THREE.Points(geo, new THREE.PointsMaterial({color: fw.color, size: 5.5, transparent: true, blending: THREE.AdditiveBlending}));
  scene.add(fw.particles);
}

// ── 纹理 ──
function createTexture(type) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const cx=64, cy=64;
  if (type === 'snow') {
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,64);
    grad.addColorStop(0, 'rgba(230,250,255,0.9)');
    grad.addColorStop(0.4, 'rgba(0,215,255,0.4)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad; ctx.fillRect(0,0,128,128);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ── 尺寸 ──
function gbUpdateDimensions() {
  const wrapper = document.getElementById('gb-canvas-wrapper');
  const w = wrapper.clientWidth || window.innerWidth;
  const h = wrapper.clientHeight || window.innerHeight;
  return { width: w, height: h };
}

// ── Three.js 初始化 ──
function gbInitThree() {
  try {
    const container = document.getElementById('gb-canvas-container');
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000510, 0.002);

    const dims = gbUpdateDimensions();
    camera = new THREE.PerspectiveCamera(50, dims.width/dims.height, 0.1, 5000);
    camera.position.set(0, 0, 350);

    renderer = new THREE.WebGLRenderer({ antialias: window.devicePixelRatio < 2, powerPreference: 'high-performance', alpha: true });
    renderer.setSize(dims.width, dims.height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    scene.add(new THREE.AmbientLight(0xaaccff, 0.4));
    const mainSpot = new THREE.SpotLight(0xeefaff, 250);
    mainSpot.position.set(50,80,50); mainSpot.penumbra=0.5; scene.add(mainSpot);
    const fillLight = new THREE.PointLight(0x0088ff, 80, 200);
    fillLight.position.set(-50,20,50); scene.add(fillLight);

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(dims.width, dims.height), 1.5, 0.4, 0.85);
    bloomPass.threshold=0.8; bloomPass.strength=1.0; bloomPass.radius=0.8;
    composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    createMaterialsAndMeshes();
    createDust();
    createBlueSnow();
    createStarField();
    scene.add(mainGroup);
    mainGroup.visible = false;
    cakeMaterials.forEach(m => { m.opacity=1.0; m.transparent=true; });

    window.addEventListener('resize', gbOnWindowResize);
    gbAnimate();
  } catch(e) {
    console.error('Gift Three.js 初始化失败:', e);
  }
}

// ── 雪 ──
function createBlueSnow() {
  const geo = new THREE.BufferGeometry();
  const pos=[], speeds=[], sizes=[];
  for (let i=0; i<CONFIG.snowCount; i++) {
    pos.push((Math.random()-0.5)*350, (Math.random()-0.5)*350, (Math.random()-0.5)*250);
    speeds.push(0.02+Math.random()*0.08);
    sizes.push(2.0+Math.random()*4.0);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('size',     new THREE.Float32BufferAttribute(sizes, 1));
  const mat = new THREE.PointsMaterial({ color:0xddeeff, size:1.0, map:createTexture('snow'), transparent:true, opacity:0.6, blending:THREE.AdditiveBlending, depthWrite:false });
  snowSystem = new THREE.Points(geo, mat);
  snowSystem.userData = { speeds };
  scene.add(snowSystem);
}

function updateSnow() {
  if (!snowSystem) return;
  const positions = snowSystem.geometry.attributes.position.array;
  const speeds = snowSystem.userData.speeds;
  for (let i=0; i<CONFIG.snowCount; i++) {
    positions[i*3+1] -= speeds[i];
    positions[i*3]   += Math.sin(time*0.5+i)*0.05;
    if (positions[i*3+1] < -120) {
      positions[i*3+1]=120; positions[i*3]=(Math.random()-0.5)*350; positions[i*3+2]=(Math.random()-0.5)*250;
    }
  }
  snowSystem.geometry.attributes.position.needsUpdate = true;
  snowSystem.rotation.y = time*0.01;
}

// ── 星形几何 ──
function createStarGeometry() {
  const shape = new THREE.Shape();
  const outerR=3.5, innerR=1.6, pts=5;
  for (let i=0; i<pts*2; i++) {
    const angle=(i*Math.PI)/pts;
    const r = i%2===0 ? outerR : innerR;
    const x=Math.cos(angle)*r, y=Math.sin(angle)*r;
    if (i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  shape.closePath();
  return new THREE.ExtrudeGeometry(shape, {steps:1,depth:0.8,bevelEnabled:true,bevelThickness:0.3,bevelSize:0.3,bevelSegments:3});
}

// ── 材质与网格 ──
function createMaterialsAndMeshes() {
  const crystalMat = new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:0.1, roughness:0.05, transmission:0.95, thickness:2.0, clearcoat:1.0, emissive:0x88ccff, emissiveIntensity:0.3, transparent:true, opacity:1, flatShading:true });
  const silverMat  = new THREE.MeshPhysicalMaterial({ color:0xaaddff, metalness:0.8, roughness:0.2, emissive:0x004488, emissiveIntensity:0.4, transparent:true, opacity:1 });
  const gemMat     = new THREE.MeshPhysicalMaterial({ color:0x0033aa, metalness:0.1, roughness:0.0, transmission:0.7, thickness:1.5, emissive:0x001166, emissiveIntensity:1.0, transparent:true, opacity:0.9, flatShading:true });
  const emeraldMat = new THREE.MeshPhysicalMaterial({ color:0x00ffff, metalness:0.1, roughness:0.1, transmission:0.6, thickness:1.5, emissive:0x008888, emissiveIntensity:0.8, transparent:true, opacity:1 });
  cakeMaterials.push(crystalMat, silverMat, gemMat, emeraldMat);

  goldMesh    = createInstancedMesh(new THREE.OctahedronGeometry(0.7,1),       crystalMat, CONFIG.goldCount,    logicData.gold);
  silverMesh  = createInstancedMesh(new THREE.CylinderGeometry(0.6,0.6,0.4,16),silverMat,  CONFIG.silverCount,  logicData.silver);
  gemMesh     = createInstancedMesh(new THREE.OctahedronGeometry(0.85,0),       gemMat,     CONFIG.gemCount,     logicData.gem);
  emeraldMesh = createInstancedMesh(new THREE.ConeGeometry(0.5,1.2,8),          emeraldMat, CONFIG.emeraldCount, logicData.emerald);

  const starGeo = createStarGeometry(); starGeo.center();
  const starMat = new THREE.MeshPhysicalMaterial({ color:0x88ffff, metalness:0.5, roughness:0.1, transmission:0.5, emissive:0x00ffff, emissiveIntensity:3.0, transparent:true, opacity:1 });
  const star = new THREE.Mesh(starGeo, starMat);
  cakeMaterials.push(starMat);
  const topTier = CONFIG.tiers[CONFIG.tiers.length-1];
  const topY = topTier.yBottom+topTier.height+4;
  star.userData = { treePos: new THREE.Vector3(0,topY,0), scatterPos: new THREE.Vector3(0,60,0) };
  star.position.copy(star.userData.treePos);
  star.add(new THREE.PointLight(0x00ffff, 100, 60));
  mainGroup.add(star);
  logicData.star = star;
}

function createInstancedMesh(geo, mat, count, dataArray) {
  const mesh = new THREE.InstancedMesh(geo, mat, count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mainGroup.add(mesh);
  for (let i=0; i<count; i++) {
    const ti = Math.floor(Math.random()*CONFIG.tiers.length);
    const tier = CONFIG.tiers[ti];
    const h = Math.random()*tier.height;
    let r = Math.sqrt(Math.random())*tier.radius;
    if (Math.random()>0.3) r = tier.radius*(0.9+Math.random()*0.15);
    const theta = Math.random()*Math.PI*2;
    const treePos = new THREE.Vector3(r*Math.cos(theta), tier.yBottom+h, r*Math.sin(theta));
    dataArray.push({ treePos, scatterPos:randomSpherePoint(40+Math.random()*40), currentPos:treePos.clone(), scale:0.6+Math.random()*0.8, rotSpeed:new THREE.Euler(Math.random()*0.03,Math.random()*0.03,Math.random()*0.03), rotation:new THREE.Euler(Math.random()*Math.PI,Math.random()*Math.PI,0), tierIndex:ti });
  }
  return mesh;
}

function randomSpherePoint(r) {
  const u=Math.random(), v=Math.random();
  const theta=2*Math.PI*u, phi=Math.acos(2*v-1);
  return new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
}

function createDust() {
  const geo = new THREE.BufferGeometry();
  const pos = [];
  for (let i=0; i<CONFIG.dustCount; i++) {
    const ti = Math.floor(Math.random()*CONFIG.tiers.length);
    const tier = CONFIG.tiers[ti];
    const r = tier.radius*(1.0+Math.random()*0.2);
    const theta = Math.random()*Math.PI*2;
    const x=r*Math.cos(theta), y=tier.yBottom+Math.random()*tier.height, z=r*Math.sin(theta);
    pos.push(x,y,z);
    logicData.dust.push({ treePos:new THREE.Vector3(x,y,z), scatterPos:randomSpherePoint(60), currentPos:new THREE.Vector3(x,y,z), tierIndex:ti });
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const dustMat = new THREE.PointsMaterial({ color:0xccffff, size:0.8, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending, depthWrite:false });
  cakeMaterials.push(dustMat);
  dustSystem = new THREE.Points(geo, dustMat);
  mainGroup.add(dustSystem);
}

function createStarField() {
  const geo = new THREE.BufferGeometry();
  const pos = [];
  for (let i=0; i<800; i++) pos.push((Math.random()-0.5)*1000,(Math.random()-0.5)*1000,(Math.random()-0.5)*1000);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color: 0xaaccff, size: 1.5, transparent: true, opacity: 0.4})));
}

function gbAnimate() {
  requestAnimationFrame(gbAnimate);
  TWEEN.update();
  time += 0.01;
  frameCount++;
  if (fireworks.length > 0) updateFireworks();
  if (introPoints && introPoints.visible) {
    introPoints.material.size = 2.0 + Math.sin(time * 15) * 1.5;
  }
  if (mainGroup.visible) {
    gbUpdateInstancedMesh(goldMesh, logicData.gold);
    gbUpdateInstancedMesh(silverMesh, logicData.silver);
    gbUpdateInstancedMesh(gemMesh, logicData.gem);
    gbUpdateInstancedMesh(emeraldMesh, logicData.emerald);
    gbUpdateDust();
    gbUpdatePhotos();
    if (logicData.star) {
      let target = currentState === STATE.TREE ? logicData.star.userData.treePos : logicData.star.userData.scatterPos;
      logicData.star.position.lerp(target, 0.1);
      logicData.star.position.y += Math.sin(time * 2) * 0.03;
      logicData.star.rotation.y += 0.02;
    }
    if (textGroup) {
      textGroup.lookAt(camera.position);
      const targetOpacity = (currentState === STATE.TREE) ? 1.0 : 0.0;
      textGroup.material.opacity += (targetOpacity - textGroup.material.opacity) * 0.1;
    }
    if (currentState === STATE.ZOOM) {
      rotationVelocity.x = 0; rotationVelocity.y = 0;
    } else if (currentState === STATE.SCATTER) {
      if (isHandPresent) {
        const deltaX = handPos.x - lastHandPos.x;
        const deltaY = handPos.y - lastHandPos.y;
        if (Math.abs(deltaX) > 0.001) rotationVelocity.y += deltaX * 0.2;
        if (Math.abs(deltaY) > 0.001) rotationVelocity.x += deltaY * 0.08;
        lastHandPos.x = handPos.x; lastHandPos.y = handPos.y;
      }
      rotationVelocity.y = Math.min(Math.max(rotationVelocity.y, -0.1), 0.1);
      rotationVelocity.x = Math.min(Math.max(rotationVelocity.x, -0.05), 0.05);
      mainGroup.rotation.y += rotationVelocity.y;
      mainGroup.rotation.x += rotationVelocity.x;
      rotationVelocity.y *= 0.95;
      rotationVelocity.x *= 0.92;
      mainGroup.rotation.x *= 0.95;
    } else if (currentState === STATE.TREE) {
      mainGroup.rotation.y += 0.003;
      mainGroup.rotation.x *= 0.95;
    }
  }
  updateSnow();
  composer.render();
}

function gbUpdateInstancedMesh(mesh, dataArray) {
  const isMobile = window.innerWidth < 768;
  const lerpFactor = isMobile ? 0.25 : 0.1;
  for (let i = 0; i < dataArray.length; i++) {
    const item = dataArray[i];
    let target = currentState === STATE.TREE ? item.treePos : item.scatterPos;
    if (currentState === STATE.ZOOM) target = item.scatterPos;
    if (currentState === STATE.SCATTER) item.currentPos.y += Math.sin(time + i) * 0.005;
    item.currentPos.lerp(target, lerpFactor);
    item.rotation.x += item.rotSpeed.x; item.rotation.y += item.rotSpeed.y;
    let s = item.scale;
    if (currentState === STATE.ZOOM) s = item.scale * 0.6;
    dummy.position.copy(item.currentPos);
    dummy.rotation.copy(item.rotation);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

function gbUpdateDust() {
  const isMobile = window.innerWidth < 768;
  const lerpFactor = isMobile ? 0.25 : 0.1;
  const positions = dustSystem.geometry.attributes.position.array;
  for (let i=0; i<logicData.dust.length; i++) {
    const item = logicData.dust[i];
    let target = currentState === STATE.TREE ? item.treePos : item.scatterPos;
    if (currentState !== STATE.TREE) {
      item.currentPos.lerp(target, lerpFactor);
    } else {
      item.currentPos.y += 0.05;
      const tier = CONFIG.tiers[item.tierIndex];
      if (item.currentPos.y > tier.yBottom + tier.height) item.currentPos.y = tier.yBottom;
      if (Math.sqrt(item.currentPos.x**2 + item.currentPos.z**2) > tier.radius * 1.3) {
        item.currentPos.x *= 0.98; item.currentPos.z *= 0.98;
      }
    }
    positions[i*3] = item.currentPos.x; positions[i*3+1] = item.currentPos.y; positions[i*3+2] = item.currentPos.z;
  }
  dustSystem.geometry.attributes.position.needsUpdate = true;
}

function gbUpdatePhotos() {
  const isMobile = window.innerWidth < 768;
  const lerpFactor = isMobile ? 0.25 : 0.1;
  photoMeshes.forEach((mesh, idx) => {
    let targetPos, targetScale = 2.0;
    if (currentState === STATE.TREE) {
      targetPos = mesh.userData.treePos;
      targetScale = 0;
    } else if (currentState === STATE.SCATTER) {
      targetPos = mesh.userData.scatterPos;
      targetScale = 4.0;
      mesh.position.y += Math.sin(time + idx) * 0.01;
      mesh.lookAt(camera.position);
    } else if (currentState === STATE.ZOOM) {
      if (idx === zoomTargetIndex) {
        const offset = new THREE.Vector3(0, 0, -20);
        offset.applyMatrix4(camera.matrixWorld);
        targetPos = mainGroup.worldToLocal(offset);
        targetScale = 2.0;
        mesh.lookAt(camera.position);
        if (mesh.material.emissive) mesh.material.emissive.setHex(0x000000);
      } else {
        targetPos = mesh.userData.scatterPos;
        targetScale = 3.0;
        mesh.lookAt(camera.position);
        if (mesh.material.emissive) mesh.material.emissive.setHex(0x222222);
      }
    }
    if (currentState === STATE.TREE) mesh.rotation.y += 0.01;
    mesh.position.lerp(targetPos, lerpFactor);
    mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), lerpFactor);
  });
}

let gbGlobalHandLandmarker = null;
let gbGlobalVideo = null;
let gbDetectionFrameId = null;

async function gbSetupMediaPipe() {
  try {
    const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm');
    gbGlobalHandLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO', numHands: 1
    });
    gbGlobalVideo = document.getElementById('gb-input-video');
    gbStartCamera();
  } catch(e) {
    console.error('MediaPipe GPU 加载失败，尝试 CPU:', e);
    try {
      const vision2 = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm');
      gbGlobalHandLandmarker = await HandLandmarker.createFromOptions(vision2, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
          delegate: 'CPU'
        },
        runningMode: 'VIDEO', numHands: 1
      });
      gbGlobalVideo = document.getElementById('gb-input-video');
      gbStartCamera();
    } catch(e2) {
      console.error('MediaPipe CPU 降级也失败:', e2);
      // MediaPipe 加载失败仍然尝试开启摄像头（仅显示画面）
      gbGlobalVideo = document.getElementById('gb-input-video');
      gbStartCamera();
    }
  }
}

function gbStartCamera() {
  if (!gbGlobalVideo) { console.warn('gbStartCamera: video element not found'); return; }
  if (gbDetectionFrameId) { cancelAnimationFrame(gbDetectionFrameId); gbDetectionFrameId = null; }
  if (gbGlobalVideo.srcObject) { gbGlobalVideo.srcObject.getTracks().forEach(t => t.stop()); gbGlobalVideo.srcObject = null; }

  // 检查是否支持 mediaDevices
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    console.error('此浏览器不支持 getUserMedia，需要 HTTPS 环境');
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
    .then(stream => {
      console.log('摄像头已成功开启');
      gbGlobalVideo.srcObject = stream;
      gbGlobalVideo.play().then(() => gbPredictWebcam());
    })
    .catch(err => {
      console.error('Camera failed:', err.name, err.message);
      // 如果是 NotAllowedError（用户拒绝），不重试
      // 如果是 NotFoundError（无设备），尝试不指定 facingMode
      if (err.name === 'NotFoundError' || err.name === 'OverconstrainedError') {
        navigator.mediaDevices.getUserMedia({ video: true })
          .then(stream => { gbGlobalVideo.srcObject = stream; gbGlobalVideo.play().then(() => gbPredictWebcam()); })
          .catch(e2 => console.error('Camera fallback also failed:', e2.name, e2.message));
      }
    });
}

let gbLastPredictionTime = -1;
async function gbPredictWebcam() {
  if (!gbGlobalHandLandmarker) { gbDetectionFrameId = requestAnimationFrame(gbPredictWebcam); return; }
  if (!gbGlobalVideo || gbGlobalVideo.paused || gbGlobalVideo.ended || gbGlobalVideo.readyState < 2) {
    gbDetectionFrameId = requestAnimationFrame(gbPredictWebcam); return;
  }
  const startTimeMs = performance.now();
  if (startTimeMs - gbLastPredictionTime < 50) { gbDetectionFrameId = requestAnimationFrame(gbPredictWebcam); return; }
  gbLastPredictionTime = startTimeMs;
  try {
    const result = gbGlobalHandLandmarker.detectForVideo(gbGlobalVideo, startTimeMs);
    const canvas = document.getElementById('gb-skeleton-canvas');
    const ctx = canvas.getContext('2d');
    if (canvas.width !== gbGlobalVideo.videoWidth || canvas.height !== gbGlobalVideo.videoHeight) {
      canvas.width = gbGlobalVideo.videoWidth;
      canvas.height = gbGlobalVideo.videoHeight;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (result.landmarks && result.landmarks.length > 0) {
      const landmarks = result.landmarks[0];
      isHandPresent = true;
      gbDrawSkeleton(ctx, landmarks, canvas.width, canvas.height);
      gbHandleGesture(landmarks);
    } else {
      isHandPresent = false;
    }
  } catch(e) {
    console.warn('手势检测帧错误:', e.message);
  }
  gbDetectionFrameId = requestAnimationFrame(gbPredictWebcam);
}

function gbDrawSkeleton(ctx, landmarks, w, h) {
  ctx.lineWidth = 3; ctx.strokeStyle = '#00ffff'; ctx.fillStyle = '#0088ff';
  const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  ctx.beginPath();
  for (let i=0; i<connections.length; i++) {
    const s = landmarks[connections[i][0]], e = landmarks[connections[i][1]];
    ctx.moveTo(s.x*w, s.y*h); ctx.lineTo(e.x*w, e.y*h);
  }
  ctx.stroke();
  for (let i=0; i<landmarks.length; i++) { ctx.beginPath(); ctx.arc(landmarks[i].x*w, landmarks[i].y*h, 4, 0, 2*Math.PI); ctx.fill(); }
}

// 手势防抖：连续 N 帧相同手势才触发状态切换
let gbGestureBuffer = [];
const GB_GESTURE_FRAMES = 4;

function gbClassifyGesture(landmarks) {
  // 用指尖(MCP关节)到中指根部(landmark 9)的距离判断弯曲
  // 更可靠：比较指尖 y 坐标与对应 PIP 关节 y 坐标（y 向下为正）
  const tips  = [8, 12, 16, 20];  // 食中无小 指尖
  const pips  = [6, 10, 14, 18];  // 对应 PIP 关节
  let folded = 0;
  for (let i = 0; i < 4; i++) {
    // 指尖 y > PIP y 表示手指弯曲（屏幕坐标 y 向下）
    if (landmarks[tips[i]].y > landmarks[pips[i]].y) folded++;
  }
  // 拇指：用指尖 x 与 IP 关节 x 的距离（镜像后）
  const thumbTip = landmarks[4];
  const thumbIP  = landmarks[3];
  const thumbFolded = Math.abs(thumbTip.x - thumbIP.x) < 0.06;

  // 捏合：拇指尖与食指尖距离
  const dPinch = Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y);
  const isPinch = dPinch < 0.07;

  // 握拳：4 根手指都弯曲
  const isFist = folded >= 4;

  // 张开：手指都伸直（折叠数 <= 1）
  const isOpen = folded <= 1 && !isPinch;

  if (isPinch) return 'pinch';
  if (isFist)  return 'fist';
  if (isOpen)  return 'open';
  return 'unknown';
}

function gbHandleGesture(landmarks) {
  if (!mainGroup.visible) return;

  // 更新手掌位置（用于旋转控制）
  const palmX = 1 - (landmarks[0].x + landmarks[9].x) / 2;
  const palmY = (landmarks[0].y + landmarks[9].y) / 2;
  handPos.x = handPos.x * 0.8 + palmX * 0.2;
  handPos.y = handPos.y * 0.8 + palmY * 0.2;

  // 防抖缓冲
  const gesture = gbClassifyGesture(landmarks);
  gbGestureBuffer.push(gesture);
  if (gbGestureBuffer.length > GB_GESTURE_FRAMES) gbGestureBuffer.shift();
  // 只有连续 N 帧都是同一手势才触发
  const stable = gbGestureBuffer.every(g => g === gesture);
  if (!stable) return;

  if (gesture === 'pinch' && currentState === STATE.SCATTER) {
    if (photoMeshes.length > 0) {
      targetState = STATE.ZOOM; currentState = STATE.ZOOM;
      if (zoomTargetIndex === -1) {
        let minDist = Infinity, bestIdx = 0;
        const camPos = camera.position, worldPos = new THREE.Vector3();
        photoMeshes.forEach((mesh, idx) => {
          mesh.getWorldPosition(worldPos);
          const d = worldPos.distanceTo(camPos);
          if (d < minDist) { minDist = d; bestIdx = idx; }
        });
        zoomTargetIndex = bestIdx;
      }
    }
  } else if (gesture === 'fist') {
    if (currentState !== STATE.TREE) {
      currentState = STATE.TREE; zoomTargetIndex = -1;
      rotationVelocity.x = 0; rotationVelocity.y = 0;
    }
  } else if (gesture === 'open') {
    if (currentState === STATE.ZOOM) {
      currentState = STATE.SCATTER; zoomTargetIndex = -1;
    } else if (currentState === STATE.TREE) {
      currentState = STATE.SCATTER;
      lastHandPos.x = handPos.x; lastHandPos.y = handPos.y;
    }
  }
}

function gbOnWindowResize() {
  const dims = gbUpdateDimensions();
  if (!dims.width || !dims.height) return;
  camera.aspect = dims.width / dims.height;
  camera.updateProjectionMatrix();
  const isPortrait = dims.height > dims.width;
  const targetZ = isPortrait ? 200 : 140;
  new TWEEN.Tween(camera.position).to({z: targetZ}, 500).easing(TWEEN.Easing.Cubic.Out).start();
  renderer.setSize(dims.width, dims.height);
  composer.setSize(dims.width, dims.height);
  composer.passes[1].resolution.set(dims.width, dims.height);
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && gbGlobalVideo && gbGlobalVideo.paused) {
    try { await gbGlobalVideo.play(); } catch(e) { gbStartCamera(); }
  }
});

document.getElementById('gb-file-input').addEventListener('change', function(e) {
  setTimeout(() => { gbStartCamera(); }, 600);
  const files = e.target.files;
  if (!files.length) return;
  for (let i=0; i<files.length; i++) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.src = evt.target.result;
      img.onload = () => { gbAddPhotoMesh(img); };
    };
    reader.readAsDataURL(files[i]);
  }
  alert('已添加 ' + files.length + ' 张照片');
});

function gbAddPhotoMesh(img) {
  const tex = new THREE.Texture(img);
  tex.needsUpdate = true; tex.colorSpace = THREE.SRGBColorSpace;
  let w = 4, h = 4;
  if (img.width > img.height) h = 4*(img.height/img.width); else w = 4*(img.width/img.height);
  const mat = new THREE.MeshStandardMaterial({
    map: tex, side: THREE.DoubleSide,
    color: new THREE.Color(0.8, 0.9, 1.0), roughness: 0.9, metalness: 0.0,
    emissive: 0x222222, emissiveIntensity: 0.5
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(w+0.2, h+0.2, 0.1),
    new THREE.MeshPhysicalMaterial({ color:0x00ffff, roughness:0.2, metalness:0.8, emissive:0x004455, emissiveIntensity:0.5 })
  );
  frame.position.z = -0.06; mesh.add(frame);
  const tierIndex = Math.floor(Math.random() * CONFIG.tiers.length);
  const tier = CONFIG.tiers[tierIndex];
  const h_pos = Math.random() * tier.height;
  const r = tier.radius * 1.1, theta = Math.random() * Math.PI * 2;
  const treePos = new THREE.Vector3(r*Math.cos(theta), tier.yBottom+h_pos, r*Math.sin(theta));
  mesh.userData = { treePos, scatterPos: randomSpherePoint(50), baseRot: new THREE.Euler(0, Math.random()*Math.PI, 0) };
  mesh.position.copy(treePos);
  photoMeshes.push(mesh);
  mainGroup.add(mesh);
}

// 启动（等待 initGiftPage 触发）

<!-- ============================================================
     Canvas 2D 点云 idle 背景 —— 定版1
     三个彩色发光小球穿梭点云，三角形布局，各自运动中心
     参数：N=120000, 点云半径0.9, BALL_R=0.25, k=0.05, THRESHOLD=0.08
     球心：4px纯色实心圆点，无光晕
     ============================================================ -->
<script>
(function() {
  const container = document.getElementById('webgpuIdleContainer');

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'width:100%;height:100%;display:block;';
  container.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  // ── 点云：球形分布 ──
  const N = 120000;
  const px = new Float32Array(N);
  const py = new Float32Array(N);
  const pz = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r   = Math.cbrt(Math.random()) * 0.9;
    const th  = Math.acos(2 * Math.random() - 1);
    const phi = Math.random() * Math.PI * 2;
    px[i] = r * Math.sin(th) * Math.cos(phi);
    py[i] = r * Math.sin(th) * Math.sin(phi);
    pz[i] = r * Math.cos(th);
  }

  // ── 三个光球（三角形布局，各自有运动中心）──
  const BALLS = [
    { r:255, g:160, b:  0,  cx:-0.25, cy:-0.15, cz:0.0,  ax:0.26, ay:0.18, az:0.14, ox:0.0, oy:0.0, oz:0.0, k:0.05, kFreq:0.23 },
    { r: 30, g: 80, b:255,  cx: 0.25, cy:-0.15, cz:0.0,  ax:0.42, ay:0.14, az:0.34, ox:2.1, oy:3.5, oz:1.3, k:0.05, kFreq:0.31 },
    { r: 40, g:200, b: 60,  cx: 0.0,  cy: 0.25, cz:0.0,  ax:0.14, ay:0.34, az:0.22, ox:4.2, oy:1.8, oz:5.0, k:0.05, kFreq:0.17 },
  ];
  const BALL_R = 0.25;
  const LIGHT_EPS = 0.003;
  const THRESHOLD = 0.08;

  let animId = null, isVisible = false;
  let W = 0, H = 0;

  function resize() {
    W = container.clientWidth  || window.innerWidth;
    H = container.clientHeight || window.innerHeight;
    canvas.width  = Math.round(W * window.devicePixelRatio);
    canvas.height = Math.round(H * window.devicePixelRatio);
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function project(wx, wy, wz, flen, cx, cy, camZ) {
    const zd = wz + camZ;
    if (zd < 0.05) return null;
    return { sx: cx + wx * flen / zd, sy: cy - wy * flen / zd, zd };
  }

  function drawBall(sx, sy, r, g, b) {
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function animate() {
    if (!isVisible) return;
    animId = requestAnimationFrame(animate);

    const t = Date.now() * 0.001;

    // 场景极慢旋转
    const sceneRY = t * 0.04;
    const cry = Math.cos(sceneRY), sry = Math.sin(sceneRY);

    const flen = Math.min(W, H) * 1.3;
    const cx = W * 0.5, cy = H * 0.5;
    const camZ = 2.5;

    // 三球当前 3D 坐标（各自绕自己中心运动，三角形布局）
    const balls3D = BALLS.map(b => {
      const bx = b.cx + Math.sin(t * b.ax + b.ox) * BALL_R;
      const by = b.cy + Math.cos(t * b.ay + b.oy) * BALL_R * 0.6;
      const bz = b.cz + Math.cos(t * b.az + b.oz) * BALL_R;
      const dynK = b.k * (1 + 0.15 * Math.sin(t * b.kFreq));
      return {
        wx:  bx * cry + bz * sry,
        wy:  by,
        wz: -bx * sry + bz * cry,
        r: b.r, g: b.g, b: b.b, k: dynK,
      };
    });

    // 清屏
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // ── 1. 点云 ──
    for (let i = 0; i < N; i++) {
      const ox = px[i], oz = pz[i];
      const wx =  ox * cry + oz * sry;
      const wz = -ox * sry + oz * cry;
      const wy = py[i];

      let R = 0, G = 0, B = 0;
      for (const ball of balls3D) {
        const dx = wx - ball.wx;
        const dy = wy - ball.wy;
        const dz = wz - ball.wz;
        const dist2 = dx*dx + dy*dy + dz*dz;
        const intensity = Math.min(1, ball.k / (dist2 + LIGHT_EPS));
        R += ball.r * intensity;
        G += ball.g * intensity;
        B += ball.b * intensity;
      }

      const brightness = (R + G + B) / (255 * 3);
      if (brightness < THRESHOLD) continue;

      const proj = project(wx, wy, wz, flen, cx, cy, camZ);
      if (!proj) continue;
      const { sx, sy, zd } = proj;
      if (sx < 0 || sx > W || sy < 0 || sy > H) continue;

      const depthF = Math.min(1, 2.0 / (zd * 0.8 + 0.5));
      R = Math.min(255, R * depthF);
      G = Math.min(255, G * depthF);
      B = Math.min(255, B * depthF);

      const a = Math.min(1, brightness * 10.0);
      const ptSize = brightness > 0.45 ? 1.8 : 1.2;
      ctx.fillStyle = `rgba(${R|0},${G|0},${B|0},${a.toFixed(2)})`;
      ctx.fillRect(sx - ptSize*0.5, sy - ptSize*0.5, ptSize, ptSize);
    }

    // ── 2. 三个发光小球 ──
    for (const ball of balls3D) {
      const proj = project(ball.wx, ball.wy, ball.wz, flen, cx, cy, camZ);
      if (!proj) continue;
      drawBall(proj.sx, proj.sy, ball.r, ball.g, ball.b);
    }
  }

  // ── 暴露控制接口 ──
  window._webgpuIdle = {
    show() {
      if (isVisible) return;
      isVisible = true;
      container.style.display = 'block';
      resize();
      animate();
    },
    hide() {
      if (!isVisible) return;
      isVisible = false;
      container.style.display = 'none';
      if (animId) { cancelAnimationFrame(animId); animId = null; }
    },
  };

    if (window.particleMode === undefined || window.particleMode === 'idle') {
    window._webgpuIdle.show();
  }
})();
</script>
